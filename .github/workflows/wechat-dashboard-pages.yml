name: Sync WeChat dashboard

on:
  push:
    branches: [main]
    paths:
      - "wechat-dashboard/**"
      - ".github/workflows/wechat-dashboard-pages.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wechat-dashboard-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh WeChat data
        shell: bash
        run: |
          set -eu
          source_url="https://feifan-ai-content-desk.songc7487.chatgpt.site"
          curl -fsS --retry 3 --max-time 120 -A "Mozilla/5.0 GitHub-Actions" -X POST "$source_url/api/auto-sync" >/dev/null || true
          fresh_file="$(mktemp)"
          if curl -fsS --retry 3 --max-time 60 -A "Mozilla/5.0 GitHub-Actions" "$source_url/api/articles" -o "$fresh_file"; then
            mv "$fresh_file" wechat-dashboard/data.json
          else
            rm -f "$fresh_file"
            echo "Using the last bundled data snapshot."
          fi
      - name: Update public GitHub table
        run: |
          node wechat-dashboard/render-dashboard.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WECHAT_DASHBOARD.md wechat-dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh WeChat dashboard"
            git push
          fi
