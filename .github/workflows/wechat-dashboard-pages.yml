name: Build WeChat dashboard snapshot

on:
  push:
    branches: [main]
    paths:
      - "wechat-dashboard/**"
      - ".github/workflows/wechat-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wechat-dashboard-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update public GitHub table
        run: |
          node wechat-dashboard/render-dashboard.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WECHAT_DASHBOARD.md wechat-dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh WeChat dashboard"
            git push
          fi
